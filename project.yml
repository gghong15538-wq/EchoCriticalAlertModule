name: EchoCriticalAlertModule
options:
  bundleIdPrefix: com.echo
  deploymentTarget:
    iOS: "11.0"
  createIntermediateGroups: true

targets:
  EchoCriticalAlertModule:
    type: framework
    platform: iOS
    sources:
      - path: EchoCriticalAlertModule
        excludes:
          - "SDK/**"
      - path: EchoCriticalAlertModule/SDK
        buildPhase: none
    settings:
      base:
        MACH_O_TYPE: staticlib
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        DEFINES_MODULE: YES
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: NO
        SKIP_INSTALL: NO
        CLANG_ENABLE_MODULES: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(SRCROOT)/EchoCriticalAlertModule/SDK/libs
        PRODUCT_BUNDLE_IDENTIFIER: com.echo.EchoCriticalAlertModule
    dependencies:
      - sdk: UserNotifications.framework
      - framework: EchoCriticalAlertModule/SDK/libs/DCUniBase.framework
        embed: false
